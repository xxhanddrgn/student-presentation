<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 반 발표 현황</title>
  <style>
    :root {
      --bg-1: #fef3ff;
      --bg-2: #e0f2fe;
      --text: #1f2937;
      --muted: #64748b;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --danger: #f43f5e;
      --success: #10b981;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      background:
        radial-gradient(circle at 10% 10%, #ffe4f2 0%, transparent 40%),
        radial-gradient(circle at 90% 10%, #e0f2fe 0%, transparent 40%),
        radial-gradient(circle at 50% 100%, #fef9c3 0%, transparent 40%),
        #f8fafc;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    header {
      text-align: center;
      padding: 14px 16px 10px;
    }
    header h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(90deg, #ec4899, #8b5cf6, #3b82f6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
    }
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 16px 20px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    .tabs {
      display: inline-flex;
      background: white;
      border-radius: 999px;
      padding: 4px;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.08);
      border: 1px solid var(--border);
    }
    .tab {
      padding: 8px 18px;
      border: none;
      background: transparent;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      color: var(--muted);
      font-size: 0.9rem;
      transition: all 0.15s;
    }
    .tab.active {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
    }
    .week-nav {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: white;
      padding: 6px;
      border-radius: 999px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.08);
    }
    .week-nav button {
      background: #f1f5f9;
      color: var(--text);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 700;
      font-size: 1rem;
      transition: all 0.15s;
    }
    .week-nav button:hover { background: #e2e8f0; }
    .week-label {
      padding: 0 14px;
      font-weight: 800;
      text-align: center;
      min-width: 180px;
    }
    .week-label .num { font-size: 1rem; }
    .week-label .range {
      font-size: 0.75rem;
      color: var(--muted);
      font-weight: 500;
      margin-top: 2px;
    }
    .this-week {
      background: white;
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    .this-week:hover {
      background: var(--primary);
      color: white;
    }

    /* 5 x 3 grid for 15 students */
    .student-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-auto-rows: 1fr;
      gap: 12px;
    }
    .student-card {
      position: relative;
      background: white;
      border-radius: 18px;
      padding: 12px;
      border: 2px solid transparent;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
      overflow: hidden;
    }
    .student-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--tint, linear-gradient(135deg, #fef3ff, #e0f2fe));
      opacity: 0.35;
      z-index: 0;
    }
    .student-card > * { position: relative; z-index: 1; }
    .student-card.active {
      border-color: var(--accent, var(--primary));
      box-shadow: 0 8px 24px color-mix(in srgb, var(--accent, var(--primary)) 25%, transparent);
    }
    .student-card:hover { transform: translateY(-2px); }

    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: white;
      font-size: 1.1rem;
      background: var(--accent, #6366f1);
      box-shadow: 0 4px 10px color-mix(in srgb, var(--accent, #6366f1) 35%, transparent);
    }
    .name {
      font-weight: 700;
      font-size: 0.95rem;
      text-align: center;
    }
    .stars {
      min-height: 22px;
      text-align: center;
      font-size: 1rem;
      letter-spacing: 1px;
      line-height: 1;
    }
    .count-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 6px;
      margin-top: auto;
    }
    .btn {
      flex: 1;
      height: 36px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 800;
      font-size: 1.1rem;
      transition: transform 0.1s, filter 0.15s;
    }
    .btn:active { transform: scale(0.92); }
    .btn.plus {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
    }
    .btn.plus:hover { filter: brightness(1.08); }
    .btn.minus {
      background: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
    }
    .btn.minus:hover { background: #fee2e2; }
    .count-pill {
      min-width: 42px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #f1f5f9;
      font-weight: 800;
      font-size: 1.05rem;
    }

    .pop {
      animation: pop 0.35s ease;
    }
    @keyframes pop {
      0% { transform: scale(1); }
      40% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .confetti {
      position: fixed;
      pointer-events: none;
      font-size: 1.6rem;
      animation: fall 900ms ease-out forwards;
      z-index: 999;
    }
    @keyframes fall {
      0% { opacity: 1; transform: translate(-50%, 0) rotate(0deg); }
      100% { opacity: 0; transform: translate(var(--dx, 0), 120px) rotate(360deg); }
    }

    .summary-card {
      background: white;
      border-radius: 18px;
      padding: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0,0,0,0.04);
    }
    .summary-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .summary-head h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 800;
    }
    .year-nav button {
      background: #f1f5f9;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: 700;
    }
    .year-nav button:hover { background: #e2e8f0; }

    .summary-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 0.9rem;
    }
    .summary-table th, .summary-table td {
      padding: 10px 8px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .summary-table th {
      background: #f8fafc;
      font-weight: 700;
      color: var(--muted);
      font-size: 0.8rem;
    }
    .summary-table th:first-child, .summary-table td:first-child {
      text-align: left;
      font-weight: 700;
    }
    .summary-table td.total {
      background: #eef2ff;
      color: var(--primary-hover);
      font-weight: 800;
    }
    .summary-table tr:hover td:not(.total) { background: #fafafa; }
    .scroll-x { overflow-x: auto; }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 40px;
      font-size: 0.9rem;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: white;
      color: var(--text);
      padding: 10px 20px;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      opacity: 0;
      transition: all 0.25s;
      pointer-events: none;
      font-weight: 700;
      border: 1px solid var(--border);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 1100px) {
      .student-grid { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 640px) {
      .student-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      header h1 { font-size: 1.3rem; }
      .week-label { min-width: 130px; }
      .avatar { width: 40px; height: 40px; font-size: 1rem; }
      .btn { height: 34px; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🌟 우리 반 발표 현황 🌟</h1>
    <p>발표하면 별이 하나씩 쌓여요!</p>
  </header>

  <main>
    <div class="toolbar">
      <div class="tabs">
        <button class="tab active" data-tab="week">주별 체크</button>
        <button class="tab" data-tab="summary">전체 요약</button>
      </div>
      <div class="week-nav">
        <button id="prevWeek" title="이전 주">◀</button>
        <div class="week-label">
          <div class="num" id="weekLabel">-</div>
          <div class="range" id="weekRange"></div>
        </div>
        <button id="nextWeek" title="다음 주">▶</button>
      </div>
      <button class="this-week" id="thisWeek">이번 주</button>
    </div>

    <section id="tab-week">
      <div class="student-grid" id="studentGrid"></div>
    </section>

    <section id="tab-summary" style="display: none;">
      <div class="summary-card">
        <div class="summary-head">
          <h2><span id="summaryYear"></span>년 요약</h2>
          <div class="year-nav">
            <button id="summaryPrevYear" title="이전 연도">◀</button>
            <button id="summaryNextYear" title="다음 연도">▶</button>
          </div>
        </div>
        <div class="scroll-x">
          <table class="summary-table" id="summaryTable"></table>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast">저장됨</div>

  <script>
    const PALETTE = [
      { accent: '#f43f5e', tint: 'linear-gradient(135deg,#ffe4e6,#fecdd3)' },
      { accent: '#f97316', tint: 'linear-gradient(135deg,#ffedd5,#fed7aa)' },
      { accent: '#eab308', tint: 'linear-gradient(135deg,#fef9c3,#fde68a)' },
      { accent: '#22c55e', tint: 'linear-gradient(135deg,#dcfce7,#bbf7d0)' },
      { accent: '#14b8a6', tint: 'linear-gradient(135deg,#ccfbf1,#99f6e4)' },
      { accent: '#06b6d4', tint: 'linear-gradient(135deg,#cffafe,#a5f3fc)' },
      { accent: '#3b82f6', tint: 'linear-gradient(135deg,#dbeafe,#bfdbfe)' },
      { accent: '#6366f1', tint: 'linear-gradient(135deg,#e0e7ff,#c7d2fe)' },
      { accent: '#8b5cf6', tint: 'linear-gradient(135deg,#ede9fe,#ddd6fe)' },
      { accent: '#a855f7', tint: 'linear-gradient(135deg,#f3e8ff,#e9d5ff)' },
      { accent: '#d946ef', tint: 'linear-gradient(135deg,#fae8ff,#f5d0fe)' },
      { accent: '#ec4899', tint: 'linear-gradient(135deg,#fce7f3,#fbcfe8)' },
      { accent: '#f43f5e', tint: 'linear-gradient(135deg,#ffe4e6,#fecdd3)' },
      { accent: '#10b981', tint: 'linear-gradient(135deg,#d1fae5,#a7f3d0)' },
      { accent: '#0ea5e9', tint: 'linear-gradient(135deg,#e0f2fe,#bae6fd)' }
    ];

    let STUDENTS = [];
    let currentYear, currentWeek;
    let summaryYear;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('show'), 1100);
    }

    function confettiAt(x, y) {
      const emojis = ['⭐', '✨', '🎉', '🌟', '💫'];
      for (let i = 0; i < 6; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.setProperty('--dx', `${(Math.random() - 0.5) * 160}px`);
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 950);
      }
    }

    function getIsoWeek(date) {
      const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
      const weekNum = Math.ceil(((d - yearStart) / 86400000 + 1) / 7);
      return { year: d.getUTCFullYear(), week: weekNum };
    }

    function dateFromIsoWeek(year, week) {
      const simple = new Date(Date.UTC(year, 0, 1 + (week - 1) * 7));
      const dayOfWeek = simple.getUTCDay();
      const monday = new Date(simple);
      if (dayOfWeek <= 4) monday.setUTCDate(simple.getUTCDate() - simple.getUTCDay() + 1);
      else monday.setUTCDate(simple.getUTCDate() + 8 - simple.getUTCDay());
      return monday;
    }

    function formatWeekRange(year, week) {
      const mon = dateFromIsoWeek(year, week);
      const sun = new Date(mon);
      sun.setUTCDate(mon.getUTCDate() + 6);
      const fmt = d => `${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
      return `${fmt(mon)} ~ ${fmt(sun)}`;
    }

    function stepWeek(delta) {
      const monday = dateFromIsoWeek(currentYear, currentWeek);
      monday.setUTCDate(monday.getUTCDate() + delta * 7);
      const { year, week } = getIsoWeek(monday);
      currentYear = year;
      currentWeek = week;
      loadWeek();
    }

    function starsFor(n) {
      if (n <= 0) return '';
      if (n <= 5) return '⭐'.repeat(n);
      return '⭐'.repeat(5) + ` +${n - 5}`;
    }

    async function loadStudents() {
      const res = await fetch('/api/students');
      const data = await res.json();
      STUDENTS = data.students;
    }

    async function loadWeek() {
      document.getElementById('weekLabel').textContent = `${currentYear}년 ${currentWeek}주차`;
      document.getElementById('weekRange').textContent = formatWeekRange(currentYear, currentWeek);
      const res = await fetch(`/api/week?year=${currentYear}&week=${currentWeek}`);
      const data = await res.json();
      renderStudents(data.counts);
    }

    function renderStudents(counts) {
      const grid = document.getElementById('studentGrid');
      grid.innerHTML = '';
      STUDENTS.forEach((name, idx) => {
        const c = counts[name] || 0;
        const pal = PALETTE[idx % PALETTE.length];
        const card = document.createElement('div');
        card.className = 'student-card' + (c > 0 ? ' active' : '');
        card.style.setProperty('--accent', pal.accent);
        card.style.setProperty('--tint', pal.tint);
        card.innerHTML = `
          <div class="avatar">${name.slice(-2)}</div>
          <div class="name">${name}</div>
          <div class="stars">${starsFor(c)}</div>
          <div class="count-row">
            <button class="btn minus" data-act="dec" aria-label="감소">−</button>
            <div class="count-pill">${c}</div>
            <button class="btn plus" data-act="inc" aria-label="발표 추가">+</button>
          </div>
        `;
        card.querySelector('[data-act="inc"]').addEventListener('click', (e) => change(name, +1, card, e));
        card.querySelector('[data-act="dec"]').addEventListener('click', (e) => change(name, -1, card, e));
        grid.appendChild(card);
      });
    }

    async function change(student, delta, card, ev) {
      const res = await fetch('/api/week/increment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ year: currentYear, week: currentWeek, student, delta })
      });
      const data = await res.json();
      if (!data.ok) return;
      const pill = card.querySelector('.count-pill');
      const stars = card.querySelector('.stars');
      pill.textContent = data.count;
      stars.textContent = starsFor(data.count);
      card.classList.toggle('active', data.count > 0);
      pill.classList.remove('pop');
      void pill.offsetWidth;
      pill.classList.add('pop');
      if (delta > 0) {
        const rect = ev.target.getBoundingClientRect();
        confettiAt(rect.left + rect.width / 2, rect.top);
        showToast(`${student} +1 🎉`);
      } else {
        showToast(`${student} -1`);
      }
    }

    async function loadSummary() {
      document.getElementById('summaryYear').textContent = summaryYear;
      const res = await fetch(`/api/summary?year=${summaryYear}`);
      const data = await res.json();
      renderSummary(data);
    }

    function renderSummary(data) {
      const table = document.getElementById('summaryTable');
      if (!data.weeks.length) {
        table.innerHTML = '<tr><td class="empty">아직 기록된 발표가 없어요. 주별 체크 탭에서 +를 눌러보세요!</td></tr>';
        return;
      }
      let html = '<thead><tr><th>학생</th>';
      for (const w of data.weeks) {
        html += `<th>${w}주<br><small style="font-weight:400">${formatWeekRange(data.year, w)}</small></th>`;
      }
      html += '<th>합계</th></tr></thead><tbody>';
      for (const name of STUDENTS) {
        html += `<tr><td>${name}</td>`;
        for (const w of data.weeks) {
          const v = data.perWeek[w][name] || 0;
          html += `<td>${v ? '⭐×' + v : '·'}</td>`;
        }
        html += `<td class="total">${data.totals[name] || 0}</td></tr>`;
      }
      html += '</tbody>';
      table.innerHTML = html;
    }

    function switchTab(which) {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === which));
      document.getElementById('tab-week').style.display = which === 'week' ? '' : 'none';
      document.getElementById('tab-summary').style.display = which === 'summary' ? '' : 'none';
      if (which === 'summary') loadSummary();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const now = new Date();
      const iso = getIsoWeek(now);
      currentYear = iso.year;
      currentWeek = iso.week;
      summaryYear = iso.year;

      await loadStudents();
      await loadWeek();

      document.getElementById('prevWeek').addEventListener('click', () => stepWeek(-1));
      document.getElementById('nextWeek').addEventListener('click', () => stepWeek(1));
      document.getElementById('thisWeek').addEventListener('click', () => {
        const iso = getIsoWeek(new Date());
        currentYear = iso.year;
        currentWeek = iso.week;
        loadWeek();
      });
      document.querySelectorAll('.tab').forEach(t => {
        t.addEventListener('click', () => switchTab(t.dataset.tab));
      });
      document.getElementById('summaryPrevYear').addEventListener('click', () => {
        summaryYear--;
        loadSummary();
      });
      document.getElementById('summaryNextYear').addEventListener('click', () => {
        summaryYear++;
        loadSummary();
      });
    });
  </script>
</body>
</html>
